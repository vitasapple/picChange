name: build-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# 显式请求写入权限，否则 GITHUB_TOKEN 默认只读，无法创建 Release
permissions:
  contents: write

env:
  VCPKG_ROOT: "C:\\vcpkg"

jobs:
  # ============ macOS 构建：Intel (x86_64) ============
  build-macos-x64:
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装 Rust stable（含 x86_64 target）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Rust 编译缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: 安装前端依赖
        run: npm ci

      - name: 构建 macOS Intel 安装包
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: "--target x86_64-apple-darwin"

      - name: 收集 Intel 产物
        shell: bash
        run: |
          mkdir -p dist-macos-x64
          cp src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg dist-macos-x64/ 2>/dev/null || true
          cp src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz dist-macos-x64/ 2>/dev/null || true
          echo "=== macOS Intel 产物 ==="
          ls -la dist-macos-x64/ || echo "(无)"

      - name: 上传 Intel 产物
        uses: actions/upload-artifact@v4
        with:
          name: macos-x64-artifacts
          path: dist-macos-x64/
          if-no-files-found: warn

  # ============ macOS 构建：Apple Silicon (aarch64) ============
  build-macos-arm64:
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装 Rust stable（含 aarch64 target）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust 编译缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: 安装前端依赖
        run: npm ci

      - name: 构建 macOS Apple Silicon 安装包
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: "--target aarch64-apple-darwin"

      - name: 收集 Apple Silicon 产物
        shell: bash
        run: |
          mkdir -p dist-macos-arm64
          cp src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg dist-macos-arm64/ 2>/dev/null || true
          cp src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz dist-macos-arm64/ 2>/dev/null || true
          echo "=== macOS Apple Silicon 产物 ==="
          ls -la dist-macos-arm64/ || echo "(无)"

      - name: 上传 Apple Silicon 产物
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-artifacts
          path: dist-macos-arm64/
          if-no-files-found: warn

  # ============ Windows 构建 ============
  build-windows:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装 Rust stable
        uses: dtolnay/rust-toolchain@stable

      # Windows runner 预装了 vcpkg 在 C:\vcpkg，通过 VCPKG_ROOT 让 libheif-sys 找到
      - name: 确认 vcpkg 环境
        shell: bash
        run: |
          echo "VCPKG_ROOT=$VCPKG_ROOT"
          ls "$VCPKG_ROOT" 2>/dev/null && echo "vcpkg 目录存在" || echo "vcpkg 目录不存在"
          "$VCPKG_ROOT/vcpkg" version

      - name: 安装 libheif（Windows HEIC 解码依赖）
        shell: bash
        run: |
          "$VCPKG_ROOT/vcpkg" install libheif:x64-windows-static-md

      - name: Rust 编译缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: 安装前端依赖
        run: npm ci

      - name: 构建 Windows 安装包（MSI + NSIS）
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ""

      - name: 收集 Windows 产物
        shell: bash
        run: |
          mkdir -p dist-windows
          cp src-tauri/target/release/bundle/nsis/*.exe dist-windows/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/msi/*.msi dist-windows/ 2>/dev/null || true
          echo "=== Windows 产物 ==="
          ls -la dist-windows/ || echo "(无)"

      - name: 上传 Windows 产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: dist-windows/
          if-no-files-found: warn

  # ============ 汇总并创建 Release ============
  create-release:
    runs-on: ubuntu-latest
    needs: [build-macos-x64, build-macos-arm64, build-windows]
    steps:
      - name: 下载所有产物
        uses: actions/download-artifact@v4
        with:
          path: release-assets/
          merge-multiple: true

      - name: 列出产物
        shell: bash
        run: ls -laR release-assets/

      - name: 创建 Release 并上传安装包
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 图片格式转换器 ${{ github.ref_name }}
          body: |
            图片格式转换器 —— 支持 HEIC/HEIF、PNG、JPG、BMP、TIFF、WEBP 批量转换。

            **支持的平台：**
            - macOS Intel (x86_64)：`_x64.dmg`
            - macOS Apple Silicon (aarch64)：`_aarch64.dmg`
            - Windows：`_x64-setup.exe`（NSIS 安装程序）+ `.msi`

            请根据你的芯片架构选择对应的 macOS 安装包。
          draft: true
          prerelease: false
          files: release-assets/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
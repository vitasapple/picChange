name: build-macos-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# 显式请求写入权限，否则 GITHUB_TOKEN 默认只读，无法创建 Release
permissions:
  contents: write

jobs:
  release-macos:
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装 Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # 安装 Intel 和 Apple Silicon 两个目标，用于构建通用二进制
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Rust 编译缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: 安装前端依赖
        run: npm ci

      - name: 构建并发布（Tauri Action）
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: "v__VERSION__"
          releaseName: "图片格式转换器 v__VERSION__"
          releaseBody: "图片格式转换器 —— 支持 HEIC/HEIF、PNG、JPG、BMP、TIFF、WEBP 批量转换。\n\n通用版本，同时支持 Intel 和 Apple Silicon Mac。"
          releaseDraft: true
          prerelease: false
          # 构建通用二进制（同时支持 x86_64 Intel 和 arm64 Apple Silicon）
          args: "--target universal-apple-darwin"
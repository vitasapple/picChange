[package]
name = "tauri-pic-converter"
version = "0.1.0"
description = "图片格式转换器"
authors = ["you"]
edition = "2021"

[lib]
name = "tauri_pic_converter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 图像处理：纯 Rust，支持 PNG/JPEG/BMP/TIFF/WEBP
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "bmp",
    "tiff",
    "webp",
] }

# 非 macOS 平台（Windows/Linux）用 libheif 解码 HEIC
[target.'cfg(not(target_os = "macos"))'.dependencies]
libheif-rs = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
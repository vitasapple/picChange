[package]
name = "tauri-pic-converter"
version = "0.1.0"
description = "图片格式转换器"
authors = ["you"]
edition = "2021"

[lib]
name = "tauri_pic_converter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 图像处理：纯 Rust，支持 PNG/JPEG/BMP/TIFF/WEBP/GIF 等
# 默认开启常用格式特性（png, jpeg, bmp, tiff, webp）
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "bmp",
    "tiff",
    "webp",
] }

# 路径 / 目录处理（预留）

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true